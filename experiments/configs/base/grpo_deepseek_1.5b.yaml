# Base config: GRPO training for DeepSeek-R1-Distill-Qwen-1.5B on RTX 4090
# Adapted from train_qwen3_4b_single_gpu.sh with adjustments for 1.5B model size

model:
  path: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
  enable_gradient_checkpointing: true
  use_remove_padding: true

algorithm:
  name: grpo
  adv_estimator: grpo
  kl_ctrl:
    kl_coef: 0.001

data:
  train_files: "./data/simplelr_qwen_level3to5/train.parquet"
  val_files: "./data/simplelr_qwen_level3to5/test.parquet"
  train_batch_size: 32
  val_batch_size: 50
  max_prompt_length: 1024
  max_response_length: 3072

actor:
  optim:
    lr: 1e-6
  ppo_mini_batch_size: 32
  ppo_micro_batch_size_per_gpu: 1
  use_kl_loss: true
  kl_loss_coef: 0.0001
  entropy_coeff: 0.001
  clip_ratio: 0.2
  kl_loss_type: "low_var_kl"
  fsdp_config:
    param_offload: false
    grad_offload: false
    optimizer_offload: true

rollout:
  name: hf
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  n: 4
  gpu_memory_utilization: 0.4
  tensor_model_parallel_size: 1
  micro_rollout_batch_size: 4
  log_prob_micro_batch_size: 2

ref:
  log_prob_micro_batch_size: 2
  fsdp_config:
    param_offload: true

trainer:
  logger: "['console','wandb']"
  project_name: "deepseek_1.5b_grpo"
  n_gpus_per_node: 1
  nnodes: 1
  save_freq: 5
  test_freq: 5
  total_epochs: 20
  remove_previous_ckpt: false
  critic_warmup: 0
